# Pushes the API in backend/ to a free Hugging Face Docker Space on every change.
# Setup (once): see backend/DEPLOY.md — needs the HF_TOKEN secret and HF_SPACE variable.
name: Deploy backend to Hugging Face

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/deploy-backend.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble Space contents
        run: |
          mkdir space
          cp -r backend/api.py backend/orchestrator.py backend/llm_client.py \
                backend/agents backend/artifacts backend/requirements.txt \
                backend/Dockerfile backend/.dockerignore space/
          rm -rf space/artifacts/eval space/artifacts/eval_pima
          # Hugging Face reads the Space settings from the README front matter.
          cat > space/README.md <<'MD'
          ---
          title: Strata API
          emoji: 🩺
          colorFrom: blue
          colorTo: green
          sdk: docker
          app_port: 7860
          pinned: false
          ---

          FastAPI backend for [Strata](https://strata.samintech.dev). Deployed from GitHub — edit the repo, not this Space.
          MD

      - name: Push to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          test -n "$HF_TOKEN" && test -n "$HF_SPACE" || { echo "Set the HF_TOKEN secret and HF_SPACE variable (see backend/DEPLOY.md)"; exit 1; }
          cd space
          git init -q -b main
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7}"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
