services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: t2d-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
    volumes:
      # optional: live reload during dev (remove for prod-like runs)
      - ./backend:/app
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: t2d-frontend
    ports:
      - "5173:5173"
    environment:
      # IMPORTANT: point the frontend to the backend container
      - VITE_API_BASE=http://127.0.0.1:8000
    volumes:
      # optional: live reload during dev (remove for prod-like runs)
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
